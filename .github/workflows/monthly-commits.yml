name: Mettre à jour les commits mensuels

on:
  schedule:
    - cron: '0 0 * * 0'   # chaque dimanche à minuit
  workflow_dispatch:      # permet un déclenchement manuel

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Generate monthly commits
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_monthly_commits.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des commits mensuels"
          git push