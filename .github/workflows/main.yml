name: Update Profile Activity
on:
  schedule:
    - cron: '0 * * * *' # Vérifie chaque heure
  workflow_dispatch: # Permet de cliquer sur un bouton pour tester
  push:
    branches: ["main"]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ Mise à jour de l'activité"
          MAX_LINES: 2
